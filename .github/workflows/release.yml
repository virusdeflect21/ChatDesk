name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Stage artifact
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Copy-Item "target\x86_64-pc-windows-msvc\release\chatdesk-web.exe" "ChatDesk-$tag-windows-x64.exe"
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ChatDesk-*-windows-x64.exe
