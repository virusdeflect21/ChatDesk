name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            ext: exe
          - os: ubuntu-24.04
            platform: linux-x64
            ext: tar.gz
          - os: macos-latest
            platform: macos-arm64
            ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Stage artifact
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${{ matrix.ext }}" = "exe" ]; then
            cp "target/release/chatdesk-web.exe" "ChatDesk-$tag-${{ matrix.platform }}.exe"
          else
            tar -czf "ChatDesk-$tag-${{ matrix.platform }}.tar.gz" -C target/release chatdesk-web
          fi
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ChatDesk-*-${{ matrix.platform }}.*
